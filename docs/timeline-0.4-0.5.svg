<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" role="img" aria-labelledby="title desc">
  <title id="title">UsageAtlas timeline: 0.4.0 through 0.4.3 shipped, 0.5.0 next</title>
  <desc id="desc">0.4.0 shipped real provider labels, a ledger at 18.6 percent of its previous size and a 63-provider discovery seed catalog. 0.4.1 added twenty-eight settings controls and restored attribution. 0.4.2 made updates hand over to the newest build, removed stale app folders and repaired the widget and provider-colour settings. 0.4.3 introduced a blended $0.54 per million token cost estimate and active tool capacity for tools without quotas. 0.5.0 has six large goals: any tool in under sixty seconds, invoice-grade cost, zero-loss multi-device cloud, invisible performance, trusted-by-construction security and ten fully translated languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1240" height="850" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="240" fill="#a78bfa" opacity="0.055"/>
  <circle cx="120" cy="800" r="220" fill="#30d158" opacity="0.04"/>

  <text x="64" y="58" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#30d158" letter-spacing="1.8">USAGEATLAS · RELEASE TIMELINE</text>
  <text x="64" y="92" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#f5f5f7">0.4.0 → 0.4.3 shipped. 0.5.0 is the next contract.</text>
  <text x="64" y="116" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1a6">Each 0.5.0 card carries the acceptance test it has to meet before it counts as done.</text>

  <text x="64" y="164" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#30d158" letter-spacing="1.6">SHIPPED · 0.4.0 → 0.4.3</text>
  <rect x="64" y="184" width="1112" height="2" rx="1" fill="#30d158" opacity="0.35"/>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="208" width="260" height="190" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#30d158" stroke-opacity="0.45"/>
      <rect x="348" y="208" width="260" height="190" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="632" y="208" width="260" height="190" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="916" y="208" width="260" height="190" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#30d158" stroke-opacity="0.32"/>
    </g>

    <text x="82" y="236" font-size="11" font-weight="700" fill="#30d158">0.4.0 · 29 OCT 2026</text>
    <text x="82" y="260" font-size="14" font-weight="650" fill="#f5f5f7">The honest release</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="82" y="286">Real provider labels, no wheel.</text>
      <text x="82" y="304">Ledger 4.61 MB → 0.856 MB.</text>
      <text x="82" y="322">63-provider discovery seed.</text>
      <text x="82" y="340">Inbox, rollback, one icon.</text>
    </g>

    <text x="366" y="236" font-size="11" font-weight="700" fill="#30d158">0.4.1 · 29 OCT 2026</text>
    <text x="366" y="260" font-size="14" font-weight="650" fill="#f5f5f7">Every setting</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="366" y="286">28 spec controls wired.</text>
      <text x="366" y="304">Attribution restored.</text>
      <text x="366" y="322">1.38 MB → 704 KB local file.</text>
      <text x="366" y="340">Day detail stored deflated.</text>
    </g>

    <text x="650" y="236" font-size="11" font-weight="700" fill="#30d158">0.4.2 · 29 OCT 2026</text>
    <text x="650" y="260" font-size="14" font-weight="650" fill="#f5f5f7">Updates that update</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="650" y="286">Newest build takes the lock.</text>
      <text x="650" y="304">Old app folders deleted.</text>
      <text x="650" y="322">Taskbar icon follows the build.</text>
      <text x="650" y="340">Widget and colour UI fixed.</text>
    </g>

    <text x="934" y="236" font-size="11" font-weight="700" fill="#30d158">0.4.3 · 29 OCT 2026</text>
    <text x="934" y="260" font-size="14" font-weight="650" fill="#f5f5f7">Costs that look real</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="934" y="286">$0.54 per 1M tokens blended.</text>
      <text x="934" y="304">Active tools without quotas.</text>
      <text x="934" y="322">Cost reprices on save.</text>
      <text x="934" y="340">1.2 GB old artifacts removed.</text>
    </g>
  </g>

  <rect x="64" y="430" width="1112" height="1" fill="#ffffff" opacity="0.10"/>
  <text x="64" y="464" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1.6">NEXT · 0.5.0</text>
  <text x="168" y="464" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1a6">Six large outcomes, no date promised. A card leaves this row only when its test passes.</text>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="488" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="442" y="488" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="820" y="488" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="64" y="636" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="442" y="636" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="820" y="636" width="356" height="132" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
    </g>

    <g font-size="10" font-weight="700" fill="#a78bfa">
      <text x="82" y="510">01</text>
      <text x="460" y="510">02</text>
      <text x="838" y="510">03</text>
      <text x="82" y="658">04</text>
      <text x="460" y="658">05</text>
      <text x="838" y="658">06</text>
    </g>
    <g font-size="13" font-weight="650" fill="#f5f5f7">
      <text x="82" y="534">Any AI tool in 60 s</text>
      <text x="460" y="534">Invoice-grade cost</text>
      <text x="838" y="534">Zero-loss cloud</text>
      <text x="82" y="682">Invisible app</text>
      <text x="460" y="682">Trusted by construction</text>
      <text x="838" y="682">World-ready</text>
    </g>
    <g font-size="10.5" fill="#a1a1a6">
      <text x="82" y="556">250+ verified providers, 95 % of installed</text>
      <text x="82" y="571">tools detected, first token in &lt; 60 s,</text>
      <text x="82" y="586">zero network calls during discovery.</text>

      <text x="460" y="556">Within ±5 % of the provider invoice for a</text>
      <text x="460" y="571">full month, with currency, tax, per-model</text>
      <text x="460" y="586">overrides and CSV/JSON export.</text>

      <text x="838" y="556">One document per provider and day.</text>
      <text x="838" y="571">Restore one year in &lt; 10 s, no duplicate</text>
      <text x="838" y="586">token after three interrupted saves.</text>

      <text x="82" y="706">&lt; 300 ms first paint, &lt; 120 MB idle,</text>
      <text x="82" y="721">no measurable idle CPU, no page switch</text>
      <text x="82" y="736">above 50 ms on the reference machine.</text>

      <text x="460" y="706">Encrypted local vault, signed update feed,</text>
      <text x="460" y="721">automatic rollback, no stale app-* folder</text>
      <text x="460" y="736">and a tampered package refused.</text>

      <text x="838" y="706">Ten languages including RTL, every string</text>
      <text x="838" y="721">translated, keyboard-only navigation and</text>
      <text x="838" y="736">WCAG 2.2 AA on the six main screens.</text>
    </g>
  </g>

  <text x="64" y="812" font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" fill="#6e6e73">Built from the open-source UsageAtlas app · MIT licence · the UsageAtlas name and logo remain the original project's</text>
</svg>
