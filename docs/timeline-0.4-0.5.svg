<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">UsageAtlas timeline: 0.4.0 shipped, 0.5.0 next</title>
  <desc id="desc">0.4.0 shipped six changes: real provider labels, a compact local ledger at 18.6 percent of its previous size, a 250-provider discovery catalog, an in-app notification inbox, one-click rollback and a two-second offline discovery budget. 0.5.0 has seven goals: deeper appearance, complete translation, cheaper idle, discovery in the app, a compact cloud format, a guarded storage migration and trusted updates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1240" height="760" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="240" fill="#a78bfa" opacity="0.055"/>
  <circle cx="120" cy="710" r="220" fill="#30d158" opacity="0.04"/>

  <text x="64" y="58" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#30d158" letter-spacing="1.8">USAGEATLAS · RELEASE TIMELINE</text>
  <text x="64" y="92" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#f5f5f7">0.4.0 shipped. 0.5.0 is the next contract.</text>
  <text x="64" y="116" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1a6">Each 0.5.0 card carries the acceptance test it has to meet before it counts as done.</text>

  <text x="64" y="164" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#30d158" letter-spacing="1.6">SHIPPED · 0.4.0</text>
  <rect x="64" y="184" width="1112" height="2" rx="1" fill="#30d158" opacity="0.35"/>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="208" width="208" height="152" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#30d158" stroke-opacity="0.45"/>
      <rect x="288" y="208" width="208" height="152" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="512" y="208" width="208" height="152" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="736" y="208" width="208" height="152" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="960" y="208" width="216" height="152" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.10"/>
    </g>
    <text x="82" y="236" font-size="11" font-weight="700" fill="#30d158">0.4.0 · 29 OCT 2026</text>
    <text x="82" y="260" font-size="14" font-weight="650" fill="#f5f5f7">The honest release</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="82" y="284">Real provider labels,</text>
      <text x="82" y="300">no relabelling wheel.</text>
      <text x="82" y="324">Ledger at 18.6 % of</text>
      <text x="82" y="340">its previous bytes.</text>
    </g>

    <text x="306" y="236" font-size="11" font-weight="700" fill="#a78bfa">STORAGE</text>
    <text x="306" y="260" font-size="14" font-weight="650" fill="#f5f5f7">One day, one record</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="306" y="284">4.61 MB → 0.856 MB</text>
      <text x="306" y="300">on a real profile.</text>
      <text x="306" y="324">2,856 → 285 rows,</text>
      <text x="306" y="340">no token lost.</text>
    </g>

    <text x="530" y="236" font-size="11" font-weight="700" fill="#a78bfa">DISCOVERY</text>
    <text x="530" y="260" font-size="14" font-weight="650" fill="#f5f5f7">250 providers by name</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="530" y="284">Offline folder probe,</text>
      <text x="530" y="300">confidence score.</text>
      <text x="530" y="324">Unknown name returns</text>
      <text x="530" y="340">empty in under 2 s.</text>
    </g>

    <text x="754" y="236" font-size="11" font-weight="700" fill="#a78bfa">ALERTS</text>
    <text x="754" y="260" font-size="14" font-weight="650" fill="#f5f5f7">A real inbox</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="754" y="284">Last 50 alerts kept</text>
      <text x="754" y="300">with arrival time.</text>
      <text x="754" y="324">Visible in the tab</text>
      <text x="754" y="340">when Windows hides it.</text>
    </g>

    <text x="978" y="236" font-size="11" font-weight="700" fill="#a78bfa">SHELL</text>
    <text x="978" y="260" font-size="14" font-weight="650" fill="#f5f5f7">Its own identity</text>
    <g font-size="11" fill="#a1a1a6">
      <text x="978" y="284">Start Menu shortcut and</text>
      <text x="978" y="300">taskbar ICO on launch.</text>
      <text x="978" y="324">One-click rollback to</text>
      <text x="978" y="340">the previous build.</text>
    </g>
  </g>

  <rect x="64" y="404" width="1112" height="1" fill="#ffffff" opacity="0.10"/>
  <text x="64" y="438" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1.6">NEXT · 0.5.0</text>
  <text x="168" y="438" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1a6">Seven goals, no date promised. A card leaves this row only when its test passes.</text>

  <g font-family="Inter, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="462" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="342" y="462" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="620" y="462" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="898" y="462" width="278" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="64" y="580" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="342" y="580" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
      <rect x="620" y="580" width="262" height="100" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.28"/>
    </g>

    <g font-size="10" font-weight="700" fill="#a78bfa">
      <text x="82" y="484">01</text>
      <text x="360" y="484">02</text>
      <text x="638" y="484">03</text>
      <text x="916" y="484">04</text>
      <text x="82" y="602">05</text>
      <text x="360" y="602">06</text>
      <text x="638" y="602">07</text>
    </g>
    <g font-size="12.5" font-weight="650" fill="#f5f5f7">
      <text x="82" y="506">Appearance, deeper</text>
      <text x="360" y="506">Complete translation</text>
      <text x="638" y="506">Cheaper idle</text>
      <text x="916" y="506">Discovery in the app</text>
      <text x="82" y="624">Compact cloud format</text>
      <text x="360" y="624">Guarded migration</text>
      <text x="638" y="624">Trusted updates</text>
    </g>
    <g font-size="10.5" fill="#a1a1a6">
      <text x="82" y="526">Free accent, density, dimming,</text>
      <text x="82" y="541">theme import and export.</text>
      <text x="360" y="526">Five catalogs, missing-key test,</text>
      <text x="360" y="541">no hard-coded English left.</text>
      <text x="638" y="526">&lt; 400 ms first paint, &lt; 250 MB</text>
      <text x="638" y="541">idle, &lt; 50 ms page switch.</text>
      <text x="916" y="526">Type a name, see the probed</text>
      <text x="916" y="541">store and its confidence.</text>
      <text x="82" y="644">One document per provider/day</text>
      <text x="82" y="659">on the server, or stay an outbox.</text>
      <text x="360" y="644">One run per account, rollback</text>
      <text x="360" y="659">copy, zero tokens lost.</text>
      <text x="638" y="644">Restart badge, rollback kept,</text>
      <text x="638" y="659">no stale “latest”.</text>
    </g>
  </g>

  <text x="64" y="726" font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" fill="#6e6e73">Built from the open-source UsageAtlas app · MIT licence · the UsageAtlas name and logo remain the original project's</text>
</svg>
